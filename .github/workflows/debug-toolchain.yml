name: debug-toolchain

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-11-arm
    steps:
      - shell: pwsh
        run: |
          echo "=== before ==="
          ls C:\msys64\clangarm64\bin 2>&1 | Select-Object -First 10
          echo "=== pacman search ==="
          C:\msys64\usr\bin\pacman -Ss "clang-aarch64-gcc" 2>&1 | Select-Object -First 10
          echo "=== install ==="
          C:\msys64\usr\bin\pacman -S --noconfirm mingw-w64-clang-aarch64-gcc 2>&1 | Select-Object -Last 15
          echo "=== after ==="
          ls C:\msys64\clangarm64\bin\gcc.exe 2>&1
          C:\msys64\clangarm64\bin\gcc.exe -dumpmachine 2>&1
