name: debug-toolchain

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-11-arm
    steps:
      - shell: pwsh
        run: |
          ls C:\msys64\clangarm64\bin | Select-Object -First 40
          echo "---"
          Get-ChildItem C:\msys64\clangarm64\bin\*.exe | Select-Object Name | Format-Table -AutoSize
          echo "--- clang check ---"
          C:\msys64\clangarm64\bin\clang.exe --version 2>&1 | Select-Object -First 5
          echo "--- gcc check ---"
          if (Test-Path C:\msys64\clangarm64\bin\gcc.exe) { C:\msys64\clangarm64\bin\gcc.exe -dumpmachine } else { echo "no gcc.exe" }
