name: build

on:
  workflow_dispatch:
    inputs:
      nim-version:
        description: "Nim version to build (e.g. 2.2.12, stable, or empty for latest upstream)."
        type: string
        default: ""
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  resolve:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      nim-version: ${{ steps.resolve.outputs.nim-version }}
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - name: Resolve Nim version
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.nim-version }}
        run: |
          set -eu
          wanted="${INPUT_VERSION:-}"
          if [[ -z "${wanted}" || "${wanted}" == "stable" ]]; then
            resolved="$(curl -fsSL https://nim-lang.org/channels/stable 2>/dev/null | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
            if [[ -z "${resolved}" ]]; then
              resolved="$(git ls-remote --tags https://github.com/nim-lang/nim 'refs/tags/v*' 2>/dev/null | sed -E 's:.*refs/tags/v?::' | sed 's/\^{}//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
            fi
          else
            if [[ "${wanted}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              resolved="${wanted#v}"
            else
              echo "ERROR: nim-version must be exact (e.g. 2.2.12) or stable, got: ${wanted}"
              exit 1
            fi
          fi
          if [[ -z "${resolved}" ]]; then
            echo "ERROR: could not resolve Nim version"
            exit 1
          fi
          echo "nim-version=${resolved}" >> "$GITHUB_OUTPUT"
          echo "resolved Nim version: ${resolved}"

      - name: Check if release already exists
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ver="${{ steps.resolve.outputs.nim-version }}"
          if gh release view "v${ver}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "should-build=false" >> "$GITHUB_OUTPUT"
            echo "release v${ver} already exists, skipping build"
          else
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            echo "release v${ver} missing, will build"
          fi

  build:
    name: build (${{ matrix.runner }} / ${{ matrix.file-suffix }}.${{ matrix.ext }})
    needs: resolve
    if: needs.resolve.outputs.should-build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            file-suffix: linux_x64
            ext: tar.xz
          - runner: ubuntu-24.04-arm
            file-suffix: linux_arm64
            ext: tar.xz
          - runner: macos-14
            file-suffix: macosx_arm64
            ext: tar.xz
          - runner: macos-15-intel
            file-suffix: macosx_x64
            ext: tar.xz
          - runner: windows-latest
            file-suffix: windows_x64
            ext: zip
          - runner: windows-11-arm
            file-suffix: windows_arm64
            ext: zip
    steps:
      - name: Clone Nim
        shell: bash
        run: |
          set -eu
          ver="${{ needs.resolve.outputs.nim-version }}"
          rm -rf Nim-src "nim-${ver}"
          git clone --depth 1 --branch "v${ver}" https://github.com/nim-lang/Nim Nim-src

      - name: Build (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          cd Nim-src
          sh build_all.sh
          cd ..
          ./Nim-src/bin/nim -v

      - name: Setup ARM64 gcc (windows-arm)
        if: runner.os == 'Windows' && contains(matrix.file-suffix, 'arm64')
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm mingw-w64-clang-aarch64-gcc
          $gcc = "C:\msys64\clangarm64\bin\gcc.exe"
          if (!(Test-Path $gcc)) { Write-Error "ARM64 gcc not found: $gcc"; exit 1 }
          "C:\msys64\clangarm64\bin" >> $env:GITHUB_PATH
          & $gcc -dumpmachine
          "ARCH=64" >> $env:GITHUB_ENV

      - name: Build (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd Nim-src
          call build_all.bat
          cd ..
          Nim-src\bin\nim -v

      - name: Package (unix tar.xz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          ver="${{ needs.resolve.outputs.nim-version }}"
          artifact="nim-${ver}-${{ matrix.file-suffix }}"
          archive="${artifact}.tar.xz"
          # Prune build intermediates (mirrors nim-lang/nightlies hbb.sh + build-release.sh).
          # Measured on 2.4.x: csources_v3/c_code 1.9G, dist/*/.git ~140M,
          # nimcache 73M, compiler/nim,nim1,nim2 25M.
          rm -rf "Nim-src/.git"
          find Nim-src -type d -name .git -prune -exec rm -rf {} +
          rm -rf Nim-src/csources Nim-src/csources_v1 Nim-src/csources_v3 Nim-src/c_code
          rm -rf Nim-src/nimcache Nim-src/build Nim-src/web Nim-src/.github
          rm -rf Nim-src/nimdoc Nim-src/tests_disabled Nim-src/drnim
          find Nim-src -type d -name nimcache -prune -exec rm -rf {} +
          find Nim-src -name '*.o' -delete
          rm -f Nim-src/compiler/nim Nim-src/compiler/nim0 Nim-src/compiler/nim1 Nim-src/compiler/nim2 Nim-src/compiler/nim3
          rm -f Nim-src/bin/nim_dbg Nim-src/bin/nim_csources_*
          for f in Nim-src/bin/nim Nim-src/bin/nimble Nim-src/bin/atlas Nim-src/bin/nimsuggest Nim-src/bin/nimpretty Nim-src/bin/testament Nim-src/bin/nimgrep Nim-src/bin/nifler Nim-src/bin/nifmake Nim-src/koch; do
            if [ -f "$f" ]; then strip "$f" 2>/dev/null || true; fi
          done
          du -sh Nim-src || true
          du -sh Nim-src/* | sort -hr | head -n 20 || true
          mv Nim-src "nim-${ver}"
          tar -cf - "nim-${ver}" | xz -9e > "${archive}"
          ls -lh "${archive}"
          tar tf "${archive}" | head -5 || true
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"
          echo "ARTIFACT=${artifact}" >> "$GITHUB_ENV"

      - name: Package (windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ needs.resolve.outputs.nim-version }}"
          $artifact = "nim-$ver-${{ matrix.file-suffix }}"
          $archive = "$artifact.zip"
          # Same pruning as unix job, adapted for PowerShell.
          $pruneDirs = @(".git", "csources", "csources_v1", "csources_v3", "c_code", "nimcache", "build", "web", ".github", "nimdoc", "tests_disabled", "drnim")
          Get-ChildItem -Path "Nim-src" -Recurse -Directory -Force -ErrorAction SilentlyContinue | Where-Object { $pruneDirs -contains $_.Name } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path "Nim-src" -Recurse -Filter "*.o" -File -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Remove-Item -Force -ErrorAction SilentlyContinue "Nim-src/compiler/nim.exe", "Nim-src/compiler/nim0.exe", "Nim-src/compiler/nim1.exe", "Nim-src/compiler/nim2.exe", "Nim-src/compiler/nim3.exe"
          Remove-Item -Force -ErrorAction SilentlyContinue "Nim-src/bin/nim_dbg.exe"
          Get-ChildItem -Path "Nim-src/bin" -Filter "nim_csources_*.exe" -File -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          if (Test-Path "nim-$ver") { Remove-Item -Recurse -Force "nim-$ver" }
          Rename-Item -Path "Nim-src" -NewName "nim-$ver"
          if (Test-Path $archive) { Remove-Item -Force $archive }
          # 7z with -mx=9 compresses much better than Compress-Archive.
          & 7z a -tzip -mx=9 $archive "nim-$ver" | Out-Null
          Get-Item $archive | Format-List Name, Length
          "ARCHIVE=$archive" >> $env:GITHUB_ENV
          "ARTIFACT=$artifact" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: release v${{ needs.resolve.outputs.nim-version }}
    needs: [resolve, build]
    if: needs.resolve.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Checksums and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ver="${{ needs.resolve.outputs.nim-version }}"
          repo="${{ github.repository }}"
          ls -lh dist/
          (cd dist && sha256sum * > sha256sums.txt && cat sha256sums.txt)
          if gh release view "v${ver}" --repo "${repo}" >/dev/null 2>&1; then
            echo "release v${ver} already exists, uploading assets"
            gh release upload "v${ver}" --repo "${repo}" dist/* --clobber
          else
            gh release create "v${ver}" --repo "${repo}" \
              --title "Nim ${ver}" \
              --notes "Prebuilt Nim ${ver} toolchains built from nim-lang/Nim@v${ver}. Mirrors nim-lang.org naming, plus Windows arm64." \
              dist/nim-*.tar.xz dist/nim-*.zip dist/sha256sums.txt
          fi
          echo "release-url=https://github.com/${{ github.repository }}/releases/tag/v${ver}" >> "$GITHUB_OUTPUT"
